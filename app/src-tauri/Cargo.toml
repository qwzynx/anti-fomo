[package]
name = "anti-fomo"
version = "0.2.2"
description = "Your internships, tech news and events in one ranked feed"
authors = ["qwzynx"]
edition = "2021"
rust-version = "1.88"  # printpdf 0.12 requires it
# Without this, the extra scraper_check binary makes `cargo run` ambiguous and
# `tauri dev` cannot start.
default-run = "anti-fomo"

# The library is the real entry point: Tauri's mobile targets build a cdylib and
# call `run()` through `tauri::mobile_entry_point`, never `main.rs`.
[lib]
name = "anti_fomo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The `*_check` binaries are development tooling, not part of the shipped app,
# so they are gated behind a feature that is off by default. `tauri build`
# bundles every bin target it is not told to skip, which had two consequences:
# each installer carried 24 MB of dev binaries and dropped them in the user's
# PATH, and the macOS universal build failed outright, because only the main
# binary is lipo'd into `target/universal-apple-darwin/release` and the bundler
# then could not find the others.
#
# Run them with `--features dev-tools`, e.g.
#   cargo run --features dev-tools --bin scraper_check
[features]
dev-tools = []

[[bin]]
name = "anti-fomo"
path = "src/main.rs"

# Standalone parity check against the old Python `check_scraper_counts.py`.
[[bin]]
name = "scraper_check"
path = "src/bin/scraper_check.rs"
required-features = ["dev-tools"]

# Coverage check for description enrichment: how many cached postings a handler
# can serve, and what enrichment does to skill extraction.
[[bin]]
name = "detail_check"
path = "src/bin/detail_check.rs"
required-features = ["dev-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
# Saving a résumé PDF. The dialog plugin picks the destination and the fs
# plugin writes there — rather than `std::fs::write` from Rust, because on
# Android the picker hands back a `content://` URI that only the fs plugin
# knows how to open.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# rustls rather than native-tls: cross-compiling OpenSSL to Android is a
# well-known source of pain, and rustls needs no system libraries.
# webpki-roots bundles the CA set so there is no system trust store to find
# either — the same binary verifies certs on Linux, Windows and Android.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "webpki-roots",
  "json",
  "gzip",
  "brotli",
  "charset",
  "http2",
] }

# "bundled" compiles SQLite from source, which cross-compiles cleanly to the
# Android NDK targets instead of hunting for a system libsqlite3.
rusqlite = { version = "0.40", features = ["bundled"] }

# Already in the tree under `regex`. Used directly so skill extraction reads a
# posting once instead of once per catalog keyword.
aho-corasick = "1"

# Résumé PDFs. `default-features = false` deliberately: the default `html`
# feature pulls in azul-layout and rust-fontconfig, a browser-shaped layout
# engine we have no use for — the résumé layout is ours, in `resume/layout.rs`
# — and fontconfig is exactly the kind of system dependency that does not
# cross-compile to the Android NDK. Stripped down it is pure Rust with no
# `-sys` crate anywhere in the tree.
#
# It also does the font parsing: with `text_layout` off, `ParsedFont` exposes
# the cmap and hmtx directly, so `resume::text` measures glyph advances with
# the very table printpdf writes into the PDF's /W array. Two parsers could
# disagree; one cannot.
printpdf = { version = "0.12", default-features = false }
scraper = "0.27"
feed-rs = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"
anyhow = "1"
async-trait = "0.1"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
# Speed, not size. This was "s", which is the right default for a shell around
# a webview and the wrong one for this app: ranking is a keyword scan over
# every cached posting — 28 MB of description text — and it runs on a phone.
# `lto` + `strip` already keep the binary reasonable.
opt-level = 3
panic = "abort"
strip = true

# `tauri dev` builds this profile, and it is the build you actually feel while
# working on the app. Unoptimized, the skill extraction pass over a real cache
# is over twenty times slower than the release one — slow enough to look like
# a bug in the code you are editing rather than in the build you are running.
[profile.dev]
opt-level = 1

# Dependencies are compiled once and never stepped through: `scraper`,
# `regex` and SQLite are all worth full optimization even in a debug build.
[profile.dev.package."*"]
opt-level = 3

# Where a feed read spends its time, against the real database.
[[bin]]
name = "perf_check"
path = "src/bin/perf_check.rs"
required-features = ["dev-tools"]

# Does the résumé PDF say what it looks like it says? Renders every theme and
# runs `pdftotext` over the result, because that is what an applicant tracking
# system does and printpdf's own extractor is not a substitute — see the bin.
[[bin]]
name = "resume_check"
path = "src/bin/resume_check.rs"
required-features = ["dev-tools"]
